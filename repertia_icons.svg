<!-- Gold R -->
<text x="500" y="142" text-anchor="middle" font-family="'Palatino Linotype', Palatino, serif" font-size="96" font-weight="400" fill="#C8A860" style="fill:rgb(200, 168, 96);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:96px;font-weight:400;text-anchor:middle;dominant-baseline:auto">R</text>

<!-- Small dot decoration -->
<circle cx="500" cy="162" r="3" fill="#C8A860" opacity="0.6" style="fill:rgb(200, 168, 96);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<text x="500" y="218" text-anchor="middle" style="fill:rgb(139, 106, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Rバージョン</text>

