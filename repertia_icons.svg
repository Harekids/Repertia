</g>

<text x="180" y="218" text-anchor="middle" style="fill:rgb(139, 106, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">鍵盤バージョン</text>

